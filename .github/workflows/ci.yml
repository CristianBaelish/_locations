name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Coherencia deploy (vercel.json vs config)
        run: npm run verify:deploy
      - name: Build cliente
        run: npm run build -w client
      - name: Ubicación en vivo
        run: node --test client/src/lib/viewerLocation.test.js server/test/location-cache.test.js
