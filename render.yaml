# Blueprint de Render: crea el Web Service al conectar el repo (New → Blueprint).
# Documentación paso a paso: DEPLOY-RENDER.md
services:
  - type: web
    name: live-street-pov
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
